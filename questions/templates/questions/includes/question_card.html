{% load static %}
<div class="card mb-4" style="width: 100%;">
            <div class="card-body">
                <div class="d-flex">
                    <div class="col-1 me-3 ">
                        <div style="height: 70px;" class="border rounded mb-2 w-100">
                            <img src="{% static question.author_avatar %}" alt="Avatar" class="img-fluid">
                        </div>
                        <div>
                            <input type="number" class="form-control" value="{{ question.rating }}">
                        </div>
                    </div>
                    
                    <div class="col-11">
                        <h5 class="card-title">{{ question.title }}</h5>
                        <p class="card-text" style="margin-bottom: 32px;">{{ question.text }}</p>
                        <a href="{% url 'questions:question' question_id=question.id %}#answers" class="card-link" style="margin-right: 30px;">Answers ({{ question.answers_count }})</a>
                    <span class="text-decoration-underline">Tags:</span>
                    {% for tag in question.tags %}
                        <a
                            href="{% url 'questions:tag' tag_name=tag %}"
                            class="link-primary link-underline-opacity-0 link-underline-opacity-100-hover"
                        >
                            {{ tag }}
                        </a>
                    {% endfor %}
                    </div>
                </div>
            </div>
        </div>
