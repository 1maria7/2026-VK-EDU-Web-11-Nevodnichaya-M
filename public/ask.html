
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="static/img/favicon.png">

    <title>AskPupkin</title>

    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="page-wrapper">
        <header class="site-header">
            <a href="index.html" class="site-logo">
                AskPupkin
            </a>
            <form class="header-search d-md-flex">
                <input type="search" class="form-control" placeholder="Search" aria-label="Search">
                <button href="ask.html" class="btn btn-outline-primary ask-button" type="submit">Ask</button>
            </form>
            <nav class="auth-links" aria-label="Login" hidden>
                <a href="login.html">Log in</a>
                <a href="signup.html">Register</a>
            </nav>
            <div class="user-info">
                <img
                    class="user-avatar"
                    src="static/img/avatar.png"
                    alt="Avatar"
                >
                <div class="user-details">
                    <span class="user-name">Dr. Pepper</span>
                    <nav class="user-actions" aria-label="Действия пользователя">
                        <a href="profile.html" class="link-primary link-underline-opacity-0">
                            Settings
                        </a>
                        <a href="login.html" class="link-secondary link-underline-opacity-0">
                            Log out
                        </a>
                    </nav>
                </div>
            </div>

        </header>
            <main class="container">
                <div class="row">
                <div class="d-flex align-items-center gap-2 mb-3 mt-4 text-base">
                    <h1>New question</h1>
                </div>
                
                    
                <section class="col-8 col-md-8">
                    <div class="border border-2 border-dark p-3 rounded">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Tittle</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="How to build a moonpark?">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Text</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="7" placeholder="Enter your text here"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Tags</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="ex.: moon">
                    </div>
                    <div class="d-grid gap-2"> <button class="btn btn-outline-primary" type="submit">Ask</button></div>
                    </div>
                </section>  
                
                
                <aside class="col-4 vcol-md-4">
                    
                    <h3 class="fs-2 fw-semibold text-base">Popular tags</h3>
                            <div class="font-monospace"style="margin-top: 20px; margin-bottom: 20px;">
                                <h4 class="popular-tags" aria-label="Popular tags">
                                    <a href="index.html" class="link-danger link-underline-opacity-0">perl</a>
                                    <a href="index.html" class="link-primary link-underline-opacity-0">python</a>
                                    <a href="index.html" class="link-dark link-underline-opacity-0">TechnoPark</a>
                                    <a href="index.html" class="link-success link-underline-opacity-0">MySQL</a>
                                    <a href="index.html" class="link-warning link-underline-opacity-0">django</a>
                                    <a href="index.html" class="link-info link-underline-opacity-0">Mail.Ru</a>
                                    <a href="index.html" class="link-primary link-underline-opacity-0">Voloshin</a>
                                    <a href="index.html" class="link-warning link-underline-opacity-0">Firefox</a>
                                </h4>
                            </div>
                    <h3 class="text-base fs-2 fw-semibold">Best Members</h3>
                    <div class="list-group font-monospace ">
                        <a href="profile.html">Mr. Freeman</a>
                        <a href="profile.html">Dr. House</a>
                        <a href="profile.html">Bender</a>
                        <a href="profile.html">Queen Victoria</a>
                        <a href="profile.html">V. Pupkin</a>
                    </div>
                    
                </aside>
                </div>
            </main>
        <footer class="site-footer"></footer>
    </div>

    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
