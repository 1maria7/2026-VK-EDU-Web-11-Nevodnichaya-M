{% load static %}

{% if user.is_authenticated %}
    <div class="user-info">
        {% if user.profile.avatar %}
            <img
                src="{{ user.profile.avatar.url }}"
                alt="Avatar"
                class="user-avatar"
            >
        {% else %}
            <img
                src="{% static 'core/img/avatar.png' %}"
                alt="Avatar"
                class="user-avatar"
            >
        {% endif %}

        <div>
            <div class="user-name">{{ user.username }}</div>

            <div class="user-actions">
                <a href="{% url 'core:profile' %}">Settings</a>


            <form action="{% url 'core:logout' %}" method="post">
                {% csrf_token %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ request.get_full_path }}"
                >

                <button
                    type="submit"
                    class="p-0 border-0 bg-transparent"
                    style="color: #0d6efd; font: inherit; line-height: inherit; cursor: pointer;"
                >
                    Log out
                </button>
            </form>

            </div>
        </div>
    </div>
{% else %}
    <nav class="auth-links" aria-label="Authentication">
        <a href="{% url 'core:login' %}">
            Log in
        </a>

        <a href="{% url 'core:signup' %}">
            Register
        </a>
    </nav>
{% endif %}
